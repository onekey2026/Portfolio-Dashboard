<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>법인 포트폴리오 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181c22;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8eaed;
    --muted: #7a8290;
    --green: #00d48a;
    --red: #ff5c5c;
    --accent: #3d7fff;
    --accent2: #7c5cfc;
    --gold: #f5c842;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  .mono { font-family: 'DM Mono', monospace; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(10,12,15,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .logo span { color: var(--accent); }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .last-update {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }
  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.08); }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Layout */
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }

  /* Summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  @media(max-width:900px){ .summary-grid { grid-template-columns: repeat(2,1fr); } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover::before { opacity: 1; }
  .card-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .card-value {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }
  .card-value.pos { color: var(--green); }
  .card-value.neg { color: var(--red); }
  .card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
  }

  /* Charts row */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1.8fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  @media(max-width:900px){ .charts-row { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .panel-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::after {
    content:'';
    flex:1;
    height:1px;
    background: var(--border);
  }

  /* Legend */
  .donut-wrap { position: relative; height: 200px; }
  .legend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
    margin-top: 14px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Table */
  .table-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .table-header-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .usd-krw-badge {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--gold);
    background: rgba(245,200,66,0.1);
    border: 1px solid rgba(245,200,66,0.2);
    padding: 3px 10px;
    border-radius: 20px;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 10px 14px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  td {
    padding: 11px 14px;
    text-align: right;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    white-space: nowrap;
  }
  td:first-child {
    text-align: left;
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
  }
  .ticker { font-weight: 500; color: var(--text); }
  .ticker-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--muted); }
  .weight-bar-wrap { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .weight-bar {
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
    opacity: 0.6;
    max-width: 60px;
    min-width: 2px;
  }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg {
    background: rgba(255,92,92,0.08);
    border: 1px solid rgba(255,92,92,0.2);
    border-radius: 8px;
    padding: 14px 18px;
    color: var(--red);
    font-size: 13px;
    margin: 20px 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo">법인 <span>포트폴리오</span> 대시보드</div>
  <div class="header-right">
    <div class="dot"></div>
    <div class="last-update" id="last-update">로딩 중...</div>
    <button class="refresh-btn" onclick="loadData()">↺ 새로고침</button>
  </div>
</header>

<div class="container">
  <div id="main-content">
    <div class="loading"><div class="spinner"></div><span>Google Sheets 데이터 불러오는 중...</span></div>
  </div>
</div>

<script>
const SHEET_ID = '1M2wOO_UZrmYdYZ7iuEBYNyCncJGMJHvtEkpd9Zojm-w';
const PUB_ID = '2PACX-1vTaUjM6fXzRa0wff_bUgqOJkAt_zn-TOXt2jSGqKETfreUjA22LRtNOUOPK5X--iktu7uaJS9T4mHbX';
const SHEET_NAME = 'Sheet1';

// 컬럼 인덱스 (0-based)
// 1행: 환율정보, 2행: 헤더, 3행~: 데이터
// A=종목명, B=달러합, C=목표비율, D=실제비율, E=최초, F=평가액
// G=목표수익, H=목표수익율, I=배당금, J=배당수익율, K=수량, L=주가(GOOGLEFINANCE), M=매입가(수동)
const COL = {
  name:   0,  // A: 종목명
  target: 2,  // C: 목표비율
  qty:    9,  // J: 수량
  price:  10, // K: 주가 (GOOGLEFINANCE 실시간)
  cost:   11, // L: 매입가 (수동 입력)
};

const TICKER_MAP = {
  'MGK':'MGK','NEOS S&P500':'SPYI','DIVO':'DIVO','엔비디아':'NVDA',
  '알파벳':'GOOGL','마이크론':'MU','브로드컴':'AVGO','애플':'AAPL',
  '일라이릴리':'LLY','JNJ':'JNJ','삼성전자우':'005935.KS',
};

const COLORS = ['#3d7fff','#00d48a','#7c5cfc','#f5c842','#ff5c5c','#00c4e8','#ff9f43','#a29bfe','#fd79a8','#55efc4','#fdcb6e'];

let pieChart = null, barChart = null;

async function fetchSheetRows() {
  // Apps Script 웹앱 경유 — CORS/인코딩 문제 없음
  const res = await fetch(APPS_SCRIPT_URL);
  if (!res.ok) throw new Error('Apps Script 접근 실패');
  const data = await res.json();
  return data; // 2D array: data[row][col]
}

function parseNum(s) {
  if (s === null || s === undefined || s === '') return 0;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

async function loadData() {
  document.getElementById('main-content').innerHTML = `<div class="loading"><div class="spinner"></div><span>Google Sheets 데이터 불러오는 중...</span></div>`;

  try {
    const rows = await fetchSheetRows(); // 2D array from Apps Script

    if (!rows || rows.length < 3) throw new Error('시트 데이터가 부족합니다.');

    // 1행(index 0): 환율 추출 (1200~1600 사이 숫자)
    let fxRate = 1350;
    for (const cell of rows[0]) {
      const v = parseFloat(cell);
      if (v > 1200 && v < 1600) { fxRate = v; break; }
    }

    // 3행(index 2)~: 종목 데이터
    const holdings = [];
    for (let i = 2; i < rows.length; i++) {
      const row = rows[i];
      const name = String(row[COL.name] || '').trim();
      if (!name) continue;

      const qty    = parseFloat(row[COL.qty])    || 0;
      const price  = parseFloat(row[COL.price])  || 0;
      const cost   = parseFloat(row[COL.cost])   || 0;
      const target = parseFloat(row[COL.target]) || 0;

      if (qty === 0 || cost === 0) continue;

      const ticker = TICKER_MAP[name] || name;
      const isKr = name === '삼성전자우';
      holdings.push({ name, ticker, qty, price, cost, target, type: isKr ? 'kr' : 'us' });
    }

    if (holdings.length === 0) throw new Error('종목 데이터를 찾을 수 없습니다. Apps Script 배포 설정을 확인하세요.');

    // 손익 계산
    const computed = holdings.map(h => {
      let valueUSD, costUSD, currentPrice;
      if (h.type === 'kr') {
        const rawPrice = h.price, rawCost = h.cost;
        if (rawPrice > 1000) {
          currentPrice = rawPrice / fxRate;
          costUSD = (h.qty * rawCost) / fxRate;
        } else {
          currentPrice = rawPrice;
          costUSD = h.qty * rawCost;
        }
        valueUSD = h.qty * currentPrice;
      } else {
        currentPrice = h.price || h.cost;
        valueUSD = h.qty * currentPrice;
        costUSD  = h.qty * h.cost;
      }
      const profitUSD = valueUSD - costUSD;
      const retPct = costUSD > 0 ? (profitUSD / costUSD) * 100 : 0;
      return { ...h, currentPrice, valueUSD, costUSD, profitUSD, retPct };
    });

    const totalValue  = computed.reduce((s, h) => s + h.valueUSD, 0);
    const totalCost   = computed.reduce((s, h) => s + h.costUSD, 0);
    const totalProfit = totalValue - totalCost;
    const totalRet    = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;
    computed.forEach(h => { h.actualWeight = (h.valueUSD / totalValue) * 100; });

    renderDashboard(computed, totalValue, totalCost, totalProfit, totalRet, fxRate);
    document.getElementById('last-update').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko-KR');

  } catch(err) {
    document.getElementById('main-content').innerHTML = `
      <div class="error-msg">
        ⚠ 데이터 로드 실패: ${err.message}<br>
        <small style="color:var(--muted);margin-top:6px;display:block">Apps Script 웹앱이 "모든 사용자" 권한으로 배포되었는지 확인하세요.</small>
      </div>`;
  }
}

function fmt(n, dec=2) { return n.toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function fmtUSD(n) { return '$' + fmt(Math.abs(n)); }
function sign(n) { return n >= 0 ? '+' : '-'; }
function cls(n) { return n >= 0 ? 'pos' : 'neg'; }

function renderDashboard(holdings, totalValue, totalCost, totalProfit, totalRet, fxRate) {
  const html = `
    <div class="summary-grid">
      <div class="card">
        <div class="card-label">총 평가액</div>
        <div class="card-value mono">${fmtUSD(totalValue)}</div>
        <div class="card-sub">USD 기준</div>
      </div>
      <div class="card">
        <div class="card-label">총 손익</div>
        <div class="card-value ${cls(totalProfit)}">${sign(totalProfit)}${fmtUSD(totalProfit)}</div>
        <div class="card-sub">${sign(totalRet)}${fmt(totalRet)}%</div>
      </div>
      <div class="card">
        <div class="card-label">USD/KRW</div>
        <div class="card-value mono" style="font-size:18px">${fmt(fxRate,0)}</div>
        <div class="card-sub">실시간 환율</div>
      </div>
      <div class="card">
        <div class="card-label">보유 종목</div>
        <div class="card-value mono">${holdings.length}</div>
        <div class="card-sub">종목</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="panel">
        <div class="panel-title">비중 구성</div>
        <div class="donut-wrap"><canvas id="pieChart"></canvas></div>
        <div class="legend-grid" id="pie-legend"></div>
      </div>
      <div class="panel">
        <div class="panel-title">종목별 수익률</div>
        <div style="position:relative;height:260px"><canvas id="barChart"></canvas></div>
      </div>
    </div>

    <div class="table-panel">
      <div class="table-header">
        <div class="table-header-title">종목별 상세</div>
        <div class="usd-krw-badge">₩ ${fmt(fxRate,0)}</div>
      </div>
      <table>
        <thead>
          <tr>
            <th>종목</th>
            <th>매입가</th>
            <th>현재가</th>
            <th>수량</th>
            <th>평가액</th>
            <th>손익</th>
            <th>수익률</th>
            <th>실제비중</th>
            <th>목표비중</th>
            <th>괴리</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;

  // Pie chart
  const sorted = [...holdings].sort((a,b) => b.actualWeight - a.actualWeight);
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: sorted.map(h => h.name),
      datasets: [{ data: sorted.map(h => h.actualWeight), backgroundColor: COLORS, borderWidth: 2, borderColor: '#111418' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed.toFixed(1)}%` } }
      }
    }
  });

  const legend = document.getElementById('pie-legend');
  sorted.forEach((h, i) => {
    const el = document.createElement('div');
    el.className = 'legend-item';
    el.innerHTML = `<span class="legend-dot" style="background:${COLORS[i]}"></span>${h.name} <span style="color:var(--text);margin-left:auto">${h.actualWeight.toFixed(1)}%</span>`;
    legend.appendChild(el);
  });

  // Bar chart
  const bySorted = [...holdings].sort((a,b) => a.retPct - b.retPct);
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: bySorted.map(h => h.name),
      datasets: [{
        data: bySorted.map(h => h.retPct),
        backgroundColor: bySorted.map(h => h.retPct >= 0 ? 'rgba(0,212,138,0.75)' : 'rgba(255,92,92,0.75)'),
        borderRadius: 3, borderSkipped: false
      }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x.toFixed(2)}%` } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#7a8290', font: { size: 10 }, callback: v => v + '%' } },
        y: { grid: { display: false }, ticks: { color: '#aab', font: { size: 11, family:'Pretendard' } } }
      }
    }
  });

  // Table rows
  const tbody = document.getElementById('tbody');
  holdings.sort((a,b) => b.valueUSD - a.valueUSD).forEach((h, i) => {
    const gap = h.actualWeight - h.target;
    const isKr = h.type === 'kr';
    const costStr    = isKr ? `₩${fmt(h.cost * fxRate, 0)}` : `$${fmt(h.cost)}`;
    const currentStr = isKr ? `₩${fmt(h.currentPrice * fxRate, 0)}` : `$${fmt(h.currentPrice)}`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="ticker">${h.name}</div>
        <div class="ticker-sub">${h.ticker}</div>
      </td>
      <td class="mono neutral">${costStr}</td>
      <td class="mono">${currentStr}</td>
      <td class="mono neutral">${h.qty.toLocaleString()}</td>
      <td class="mono">$${fmt(h.valueUSD)}</td>
      <td class="mono ${cls(h.profitUSD)}">${sign(h.profitUSD)}$${fmt(Math.abs(h.profitUSD))}</td>
      <td class="mono ${cls(h.retPct)}">${sign(h.retPct)}${fmt(Math.abs(h.retPct))}%</td>
      <td>
        <div class="weight-bar-wrap">
          <div class="weight-bar" style="width:${Math.min(h.actualWeight*3,60)}px"></div>
          <span class="mono">${fmt(h.actualWeight,1)}%</span>
        </div>
      </td>
      <td class="mono neutral">${fmt(h.target,1)}%</td>
      <td class="mono ${Math.abs(gap) > 2 ? (gap > 0 ? 'pos' : 'neg') : 'neutral'}">${gap > 0 ? '+' : ''}${fmt(gap,1)}%</td>
    `;
    tbody.appendChild(tr);
  });
}

loadData();
setInterval(loadData, 5 * 60 * 1000); // auto-refresh every 5 min
</script>
</body>
</html>
